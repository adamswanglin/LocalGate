<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- AI Core Gradient -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />   <!-- Sky Blue -->
      <stop offset="50%" stop-color="#8B5CF6" />  <!-- Violet -->
      <stop offset="100%" stop-color="#EC4899" /> <!-- Pink -->
    </linearGradient>

    <!-- Subtle Glow for the AI Star -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Modern Dark Background (Zinc-950) -->
  <rect width="512" height="512" rx="112" fill="#09090B" />

  <!-- ================= L-G GATEWAY BOX ================= -->
  <!-- 
    This single continuous path forms both an "L" (left and bottom) 
    and a "G" (overall shape with the inward pointing crossbar).
    The stroke-linejoin perfectly rounds the structural corners, 
    while linecap rounds the open ends.
  -->
  <path 
    d="M 356 256 
       L 400 256 
       L 400 368 
       L 112 368 
       L 112 144 
       L 400 144" 
    fill="none" 
    stroke="#FFFFFF" 
    stroke-width="40" 
    stroke-linecap="round" 
    stroke-linejoin="round"
  />

  <!-- ================= PROTOCOL INDICATOR LEDS ================= -->
  <!-- 3 subtle inset dots representing the 3 supported protocols (OpenAI, Anthropic, Responses) -->
  <!-- The dark stroke creates a beautiful "cutout" effect against the white bar -->
  <circle cx="216" cy="144" r="7" fill="#10B981" stroke="#09090B" stroke-width="3" />
  <circle cx="256" cy="144" r="7" fill="#3B82F6" stroke="#09090B" stroke-width="3" />
  <circle cx="296" cy="144" r="7" fill="#F59E0B" stroke="#09090B" stroke-width="3" />

  <!-- ================= AI SPARK CORE ================= -->
  <!-- Perfectly centered, leaving a precise 16px geometric gap from the crossbar tip -->
  <path 
    d="M 256 192 
       Q 256 256 192 256 
       Q 256 256 256 320 
       Q 256 256 320 256 
       Q 256 256 256 192 Z" 
    fill="url(#aiGrad)" 
    filter="url(#glow)"
  />
</svg>