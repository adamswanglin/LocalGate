name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS: 仅 arm64（GitHub Actions 对 Intel runner 支持不佳，不再打 x64）──
  # 关键经验（2026-08 本机复现确认）：
  #   1) build.mac.target 里写死 arch 会让 CLI 的 --arch 失效、一次打出双架构。
  #      故 mac.target 只写 ["dmg","zip"]（不锁 arch），让 CLI --arm64 唯一决定架构。
  #   2) npmRebuild:true 按 --arch 重编 better-sqlite3；devDeps 的裁剪通过
  #      package.json 的 files 否定规则兜底（CI 里 electron 等 devDeps 会漏入，
  #      见下），并保留 zip 体积护栏（>250M 失败）防回归。
  build-mac:
    name: macOS (arm64)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 用 tag 回写 package.json 版本号，保证产物名与 tag 一致
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='./package.json';const j=JSON.parse(fs.readFileSync(p));j.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          echo "package version -> ${VERSION}"

      - run: pnpm run build

      # 仅构建；npmRebuild:true 自动按 --arm64 重编 better-sqlite3。发布交给独立的 release job。
      - run: pnpm exec electron-builder --mac --arm64 --publish never

      # 校验：遍历 release 下所有 better_sqlite3.node，逐一核对架构；
      # 并对 zip 加体积护栏，防止 devDeps 漏入导致产物膨胀（曾出现 1.1GB）。
      - name: Verify native module arch + zip size
        shell: bash
        run: |
          set -e
          COUNT=0
          for NODE in $(find release -path '*better_sqlite3.node'); do
            COUNT=$((COUNT+1))
            echo "native module #$COUNT: $NODE"
            file "$NODE"
            file "$NODE" | grep -q arm64 || { echo "::error::arch mismatch: need arm64"; exit 1; }
          done
          [ "$COUNT" -ge 1 ] || { echo "::error::no .node found in release"; exit 1; }
          # 体积护栏：mac zip 正常 ~101M，超过 250M 视为膨胀
          ZIP=$(find release -name 'LocalGate-*-mac.zip' | head -1)
          if [ -n "$ZIP" ]; then
            SZ=$(wc -c < "$ZIP" | tr -d ' ')
            echo "zip size: $SZ bytes ($ZIP)"
            [ "$SZ" -lt 262144000 ] || { echo "::error::zip bloated (>250MB), likely devDeps leaked"; exit 1; }
          fi
          echo "arch + size ok (arm64)"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            release/LocalGate-*.dmg
            release/LocalGate-*-arm64-mac.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: warn

  # ── Windows: x64 ────────────────────────────────────────
  build-win:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='./package.json';const j=JSON.parse(fs.readFileSync(p));j.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          echo "package version -> ${VERSION}"

      - run: pnpm exec electron-rebuild --force --arch=x64 -w better-sqlite3

      - run: pnpm run build

      - run: pnpm exec electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/*setup.exe
            release/latest.yml
          if-no-files-found: warn

  # ── Linux: x64 ──────────────────────────────────────────
  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e "const fs=require('fs');const p='./package.json';const j=JSON.parse(fs.readFileSync(p));j.version='${VERSION}';fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')"
          echo "package version -> ${VERSION}"

      - run: pnpm exec electron-rebuild --force --arch=x64 -w better-sqlite3

      - run: pnpm run build

      - run: pnpm exec electron-builder --linux --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: warn

  # ── Release: 合并所有产物发布到 GitHub Release ──────────
  release:
    name: Publish Release
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List all artifacts
        run: find artifacts -type f

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
