name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS: arm64 + x64 in a single build ─────────────────
  # Building both arches in one electron-builder run (per package.json mac.target)
  # instead of a parallel matrix avoids the publish race where two jobs fought over
  # the same release assets (404 on asset DELETE). It also yields one combined
  # latest-mac.yml listing both arches, which auto-update needs.
  build-mac:
    name: macOS (arm64 + x64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec electron-rebuild -w better-sqlite3

      - run: pnpm run build

      # Build only — the dedicated `release` job does the publishing.
      - run: pnpm exec electron-builder --mac --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            release/LocalGate-*.dmg
            release/LocalGate-*-mac.zip
            release/latest-mac.yml
          if-no-files-found: warn

  # ── Windows: x64 ────────────────────────────────────────
  build-win:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec electron-rebuild -w better-sqlite3

      - run: pnpm run build

      - run: pnpm exec electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            release/*setup.exe
            release/latest.yml
          if-no-files-found: warn

  # ── Linux: x64 ──────────────────────────────────────────
  build-linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec electron-rebuild -w better-sqlite3

      - run: pnpm run build

      - run: pnpm exec electron-builder --linux --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            release/*.AppImage
            release/latest-linux.yml
          if-no-files-found: warn

  # ── Release: 合并所有产物发布到 GitHub Release ──────────
  release:
    name: Publish Release
    needs: [build-mac, build-win, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List all artifacts
        run: find artifacts -type f

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
